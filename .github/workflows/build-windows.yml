name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build Windows installer
        run: npm run build && npx electron-builder --win --x64 --config.win.signAndEditExecutable=false --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: my-pact-windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
